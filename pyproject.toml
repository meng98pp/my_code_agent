[project]
name = "my-code-agent"
version = "0.1.1"
description = "终端编程助手：LLM + 工具调用 + 可配置文件记忆"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai",
    "pydantic-settings",
    "openai",
    "rich",
    "prompt_toolkit",
    "questionary",
    "mcp",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
my-code-agent = "my_code_agent.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
