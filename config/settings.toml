# 环境变量优先于本文件。密钥不要写在这里，用 API_KEY。
# cwd 下的 settings.toml 可覆盖本文件。

model = "deepseek-flash"
# base_url = "https://api.deepseek.com"

# 采样：越低越稳。一般不要同时改 temperature 和 top_p。
temperature = 0.7
# top_p = 0.9
# max_tokens = 4096
# timeout = 120.0

# 思考：true / false，或 "low" / "medium" / "high" / "max"
# deepseek-flash 默认会思考；deepseek-chat 默认不思考；deepseek-reasoner 关不掉。
thinking = true
